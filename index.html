<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo CI/CD</title>
  <style>
    :root {
      /*https://jorgejunqueiro.github.io/CICD/*/
      /* MUDAR NA APRESENTAÇÃO: Ex: de azul (#1d4ed8) para verde (#047857) */
      --cor-fundo: #4cd81d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--cor-fundo);
      color: white;
      transition: background-color 0.5s ease;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .calc-box {
      background: rgba(0, 0, 0, 0.2);
      padding: 20px;
      border-radius: 12px;
      font-size: 1.2rem;
    }

    .resultado {
      font-size: 2rem;
      font-weight: bold;
      color: #fde047;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- MUDAR NA APRESENTAÇÃO: Ex: de "Versão 1.0" para "Versão 2.0" -->
    <div class="badge">VERSÃO 1.0</div>

    <!-- MUDAR NA APRESENTAÇÃO -->
    <h1>Deploy Automático 🚀</h1>
    <p>Este site foi testado e publicado automaticamente via GitHub Actions.</p>

    <div class="calc-box">
      <div>Teste da função <code>somar(2, 3)</code> em produção:</div>
      <div class="resultado" id="resultado">...</div>
    </div>
  </div>

  <!-- Importa a lógica que também é testada no CI -->
  <script src="app.js"></script>
  <script>
    document.getElementById('resultado').textContent = somar(2, 3);
  </script>

</body>
</html>
